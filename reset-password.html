<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | PepX Research Chemicals</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page" data-auth-page="reset-password">
  <div class="public-announcement-bar">For laboratory research use only. Not for human consumption.</div>
  <header class="public-header"><div class="container nav">
    <a href="index.html" class="logo" aria-label="PepX Research Chemicals"><img src="assets/logo-pepx-navbar.png" alt="PepX Research Chemicals" class="logo-image"></a>
    <nav class="public-menu" aria-label="Public navigation">
      <a href="index.html">Home</a>
      <a href="mailto:pepxaminos@gmail.com?subject=PepX%20Research%20Inquiry">Contact Us</a>
    </nav>
    <a href="login.html" class="public-account-link" aria-label="Login or Register">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M4 20c1.5-3.2 4.2-4.8 8-4.8s6.5 1.6 8 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    </a>
  </div></header>

  <main class="auth-page-shell">
    <section class="auth-page-card" aria-label="Reset password form">
      <h1>Create New Password</h1>
      <p class="auth-page-switch">Need to go back? <a href="login.html">Sign In</a></p>
      <form class="auth-page-form" id="resetPasswordForm" novalidate>
        <input type="hidden" name="token" id="resetPasswordToken">
        <label>
          <span>New Password</span>
          <span class="password-input-wrap">
            <input type="password" name="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle-password>Show</button>
          </span>
          <small class="auth-inline-error" data-error-for="password"></small>
        </label>
        <label>
          <span>Confirm New Password</span>
          <span class="password-input-wrap">
            <input type="password" name="confirmPassword" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-toggle-password>Show</button>
          </span>
          <small class="auth-inline-error" data-error-for="confirmPassword"></small>
        </label>
        <p class="auth-page-message" id="resetPasswordMessage" aria-live="polite"></p>
        <div class="auth-page-actions">
          <button type="submit" class="btn primary">Update Password</button>
        </div>
      </form>
    </section>
  </main>

  <footer><div class="container">
    <div class="copy">&copy; 2026 PepX Research Chemicals. For research use only. Not for human consumption.</div>
    <div class="policy-links" aria-label="Footer Policies">
      <a class="policy-btn" href="shipping-policy.html">Shipping Policy</a>
      <a class="policy-btn" href="privacy-policy.html">Privacy Policy</a>
      <a class="policy-btn" href="refund-policy.html">Refund Policy</a>
      <a class="policy-btn" href="terms-conditions.html">Terms &amp; Conditions</a>
      <a class="policy-btn" href="terms-of-service.html">Terms of Service</a>
    </div>
  </div></footer>

  <script src="auth-page.js"></script>
</body>
</html>
